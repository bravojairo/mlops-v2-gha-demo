name: deploy-model-training-pipeline

on: 
  workflow_dispatch:
  
permissions:
  contents: read
  id-token: write

jobs:
  get-config:
      uses: Azure/mlops-templates/.github/workflows/read-yaml.yml@main
      with:
        file_name: config-infra-prod.yml
  register-environment:
      needs: get-config
      uses: Azure/mlops-templates/.github/workflows/register-environment.yml@main
      with:
        resource_group: ${{ needs.get-config.outputs.resource_group }}
        workspace_name: ${{ needs.get-config.outputs.aml_workspace }}     
        environment_file:  mlops/azureml/train/train-env.yml
        conda_file: data-science/environment/train-conda.yml
      secrets:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
  register-dataset:
    needs: get-config
    uses: Azure/mlops-templates/.github/workflows/register-dataset.yml@main
    with:
      resource_group: ${{ needs.get-config.outputs.resource_group }}
      workspace_name: ${{ needs.get-config.outputs.aml_workspace }}
      name: taxi-data
      data_file: mlops/azureml/train/data.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
  create-compute:
    needs: [get-config,register-environment,register-dataset]
    runs-on: ubuntu-latest
    steps:
      - name: Az CLI login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Create compute if missing
        env:
          RESOURCE_GROUP: ${{ needs.get-config.outputs.resource_group }}
          WORKSPACE_NAME: ${{ needs.get-config.outputs.aml_workspace }}
        run: |
          az extension add -n ml -y
          if ! az ml compute show --name cpu-cluster --resource-group "$RESOURCE_GROUP" --workspace-name "$WORKSPACE_NAME" --output none 2>/dev/null; then
            az ml compute create --name cpu-cluster --type AmlCompute \
              --tier Dedicated --size Standard_DS3_v2 \
              --min-instances 0 --max-instances 4 \
              --resource-group "$RESOURCE_GROUP" --workspace-name "$WORKSPACE_NAME"
          fi
          for attempt in {1..30}; do
            if provisioning_state=$(az ml compute show --name cpu-cluster \
              --resource-group "$RESOURCE_GROUP" --workspace-name "$WORKSPACE_NAME" \
              --query provisioning_state -o tsv 2>/dev/null) &&
              [[ "$provisioning_state" == "Succeeded" ]]; then
              exit 0
            fi
            if [[ "$provisioning_state" == "Failed" ]]; then
              echo "cpu-cluster provisioning failed"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for cpu-cluster to finish provisioning"
          exit 1
      
  run-pipeline:
      needs: [get-config,register-environment,create-compute,register-dataset]
      runs-on: ubuntu-latest
      permissions:
        contents: read
        id-token: write
      steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: Az CLI login
          uses: azure/login@v2
          with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        - name: Install Azure ML extension
          run: |
            az extension add -n ml -y
            az extension update -n ml
        - name: Run and monitor pipeline
          env:
            AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
            AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
            AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            RESOURCE_GROUP: ${{ needs.get-config.outputs.resource_group }}
            WORKSPACE_NAME: ${{ needs.get-config.outputs.aml_workspace }}
            PARAMETERS_FILE: mlops/azureml/train/pipeline.yml
          run: |
            set -euo pipefail

            refresh_login() {
              local token
              token=$(curl --fail --silent --show-error \
                -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
                | jq -er '.value')
              az account clear
              az login --service-principal \
                --username "$AZURE_CLIENT_ID" \
                --tenant "$AZURE_TENANT_ID" \
                --federated-token "$token" \
                --allow-no-subscriptions --output none
              az account set --subscription "$AZURE_SUBSCRIPTION_ID"
            }

            last_login=$(date +%s)
            run_id=$(az ml job create \
              --file "$GITHUB_WORKSPACE/$PARAMETERS_FILE" \
              --resource-group "$RESOURCE_GROUP" \
              --workspace-name "$WORKSPACE_NAME" \
              --query name -o tsv)
            if [[ -z "$run_id" ]]; then
              echo "Job creation failed"
              exit 3
            fi
            echo "Monitoring Azure ML job $run_id"

            status=$(az ml job show -n "$run_id" \
              --resource-group "$RESOURCE_GROUP" \
              --workspace-name "$WORKSPACE_NAME" \
              --query status -o tsv)
            if [[ -z "$status" ]]; then
              echo "Status query failed"
              exit 4
            fi

            while [[ "$status" =~ ^(NotStarted|Queued|Starting|Preparing|Running|Finalizing|CancelRequested)$ ]]; do
              sleep 15
              now=$(date +%s)
              if (( now - last_login >= 2700 )); then
                refresh_login
                last_login=$now
              fi
              status=$(az ml job show -n "$run_id" \
                --resource-group "$RESOURCE_GROUP" \
                --workspace-name "$WORKSPACE_NAME" \
                --query status -o tsv)
              echo "$status"
            done

            if [[ "$status" != "Completed" ]]; then
              echo "Training Job failed or canceled"
              exit 3
            fi
