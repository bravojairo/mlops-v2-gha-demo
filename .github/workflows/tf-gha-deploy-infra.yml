name: tf-gha-deploy-infra.yml

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  config_env: 'none'

jobs:
  get-config:
    uses: Azure/mlops-templates/.github/workflows/read-yaml.yml@main
    with:
      file_name: config-infra-prod.yml

  check-terraform-state-access:
    needs: get-config
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      - name: Verify state storage access
        env:
          STATE_ACCOUNT: ${{ needs.get-config.outputs.terraform_st_storage_account }}
          STATE_RESOURCE_GROUP: ${{ needs.get-config.outputs.terraform_st_resource_group }}
          STATE_CONTAINER: ${{ needs.get-config.outputs.terraform_st_container_name }}
        run: |
          if [[ $(az group exists --name "$STATE_RESOURCE_GROUP") == false ]] ||
             [[ $(az storage account list --resource-group "$STATE_RESOURCE_GROUP" --query "[?name=='$STATE_ACCOUNT'] | length(@)" -o tsv) == 0 ]]; then
            exit 0
          fi
          if ! az storage blob list --account-name "$STATE_ACCOUNT" --container-name "$STATE_CONTAINER" --auth-mode login --num-results 1 --output none; then
            echo "::error::The deployment identity cannot list Terraform state blobs. An Azure administrator must grant it Storage Blob Data Contributor on the state storage account; see README.md."
            exit 1
          fi

  test-terraform-state-deployment:
    needs: [get-config, check-terraform-state-access]
    uses: Azure/mlops-templates/.github/workflows/tf-gha-install-terraform.yml@main
    with:
      TFAction: 'apply'
      dply_environment: ${{ needs.get-config.outputs.environment }}
      location: ${{ needs.get-config.outputs.location }}
      namespace: ${{ needs.get-config.outputs.namespace }}
      postfix: ${{ needs.get-config.outputs.postfix }}
      environment: ${{ needs.get-config.outputs.environment }}
      enable_aml_computecluster: ${{ needs.get-config.outputs.enable_aml_computecluster == true }}
      enable_monitoring: ${{ needs.get-config.outputs.enable_monitoring == true }}
      terraform_version: ${{ needs.get-config.outputs.terraform_version }}
      terraform_workingdir: ${{ needs.get-config.outputs.terraform_workingdir }}
      terraform_st_location: ${{ needs.get-config.outputs.terraform_st_location }}
      terraform_st_storage_account: ${{ needs.get-config.outputs.terraform_st_storage_account }}
      terraform_st_resource_group: ${{ needs.get-config.outputs.terraform_st_resource_group }}
      terraform_st_container_name: ${{ needs.get-config.outputs.terraform_st_container_name }}
      terraform_st_key: ${{ needs.get-config.outputs.terraform_st_key }}
      terraform_plan_location: ${{ needs.get-config.outputs.location }}
      terraform_plan_vnet: 'TBD'
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      
  deploy-azureml-resources:
    runs-on: ubuntu-latest
    steps:
      - id: deploy-aml-workspace
        name: deploy-aml-workspace
        run: echo "OK"
